name: Router 自动签到

on:
  # 定时执行 - 每6小时执行一次
  schedule:
    - cron: '0 */6 * * *'

  # 手动触发
  workflow_dispatch:
    inputs:
      manual_run:
        description: '手动触发签到'
        required: false
        default: 'true'

jobs:
  checkin:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write       # 允许提交和推送更改
      deployments: write    # 允许写入 deployment 状态描述

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 获取 Playwright 版本
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(python -c "from importlib.metadata import version; print(version('playwright'))")
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT
          echo "Playwright version: $PLAYWRIGHT_VERSION"

      - name: 缓存 Playwright 浏览器
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 安装 Playwright 浏览器
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 设置 Clash 代理（可选）
        env:
          SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
        run: |
          # 检查是否配置了代理订阅
          if [ -z "$SUBSCRIPTION_URL" ]; then
            echo "⚠️ 未配置代理订阅，跳过 Clash 代理设置"
            exit 0
          fi

          echo "=== 📡 开始配置 Clash 代理 ==="

          # 下载 Clash.Meta (mihomo)
          echo "📥 下载 Clash.Meta..."
          wget -q -O clash.gz "https://github.com/MetaCubeX/mihomo/releases/download/v1.18.10/mihomo-linux-amd64-v1.18.10.gz"
          gunzip clash.gz
          chmod +x clash

          # 生成 Clash 配置文件
          echo "📝 生成 Clash 配置..."
          cat > config.yaml << EOF
          mixed-port: 7890
          allow-lan: false
          mode: rule
          log-level: info
          external-controller: 127.0.0.1:9090

          proxy-providers:
            my-provider:
              type: http
              url: ${SUBSCRIPTION_URL}
              interval: 3600
              path: ./subscription.yaml
              health-check:
                enable: true
                interval: 300
                url: http://www.gstatic.com/generate_204

          proxies: []

          proxy-groups:
            - name: PROXY
              type: url-test
              use:
                - my-provider
              url: http://www.gstatic.com/generate_204
              interval: 300

          rules:
            - MATCH,PROXY
          EOF

          # 启动 Clash（后台运行）
          echo "🚀 启动 Clash..."
          ./clash -f config.yaml &
          CLASH_PID=$!
          echo "Clash PID: $CLASH_PID"

          # 等待 Clash 启动并下载订阅
          echo "⏳ 等待 Clash 启动和订阅下载（15秒）..."
          sleep 15

          # 测试代理是否可用
          echo "🔍 测试代理连接..."
          if curl -x http://127.0.0.1:7890 -s -m 10 -o /dev/null -w "%{http_code}" https://www.google.com | grep -q "200"; then
            echo "✅ Clash 代理启动成功"
          else
            echo "⚠️ 代理测试失败，但继续执行"
          fi

      - name: 执行签到
        env:
          # 账号配置
          ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
          AGENTROUTER_ACCOUNTS: ${{ secrets.AGENTROUTER_ACCOUNTS }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          PROVIDERS: ${{ secrets.PROVIDERS }}

          # 通知配置
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}

          # 代理配置（使用本地 Clash 提供的 HTTP 代理）
          # 仅当配置了代理订阅时才启用代理
          USE_PROXY: ${{ secrets.PROXY_SUBSCRIPTION_URL != '' }}
          PROXY_SERVER: ${{ secrets.PROXY_SUBSCRIPTION_URL != '' && 'http://127.0.0.1:7890' || '' }}

          # 代理细粒度控制（可选）
          PROXY_METHODS: ${{ secrets.PROXY_METHODS }}
          NO_PROXY_METHODS: ${{ secrets.NO_PROXY_METHODS }}

          # CI 环境优化
          CI_DISABLED_AUTH_METHODS: ${{ secrets.CI_DISABLED_AUTH_METHODS }}
          SESSION_CACHE_KEY: ${{ secrets.SESSION_CACHE_KEY }}
        run: |
          python main.py

      - name: 上传余额记录（备份）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-data-${{ github.run_number }}
          path: |
            balance_hash.txt
            balance_data.json
          retention-days: 7

      - name: 更新 Deployment 描述（显示余额摘要）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # 1) 生成余额摘要（控制在 140 字符以内）
          if [ -f balance_data.json ]; then
            SUMMARY=$(python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          try:
              with open('balance_data.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              n = len(data)
              total_q = sum(v.get('quota', 0) for v in data.values())
              total_u = sum(v.get('used', 0) for v in data.values())
              ts = datetime.now(timezone(timedelta(hours=8))).strftime('%m-%d %H:%M')
              print(f"{n}账号 · 余额 ${total_q:,.2f} · 已用 ${total_u:,.2f} · {ts}")
          except Exception as e:
              print(f"读取余额失败: {e}")
          PY
          )
          else
            SUMMARY="未生成余额数据"
          fi

          # 截断到 140 字符（GitHub API 上限）
          SUMMARY=$(printf "%.140s" "$SUMMARY")

          # 2) job 状态映射到 deployment state
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
          else
            STATE="failure"
          fi

          echo "📝 摘要: $SUMMARY"
          echo "📊 状态: $STATE"

          # 3) 找到本次运行对应的 deployment（按 SHA + environment 倒序取最新）
          DEPLOYMENT_ID=$(gh api \
            "/repos/${REPO}/deployments?sha=${SHA}&environment=production&per_page=1" \
            --jq '.[0].id // empty' || echo "")

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "⚠️ 未找到对应的 deployment,跳过状态更新"
            exit 0
          fi

          echo "🎯 Deployment ID: $DEPLOYMENT_ID"

          # 4) 写入状态(描述会显示在 deployments 列表里)
          gh api -X POST \
            "/repos/${REPO}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="$STATE" \
            -f description="$SUMMARY" \
            -f log_url="https://github.com/${REPO}/actions/runs/${RUN_ID}" \
            -f environment_url="https://github.com/${REPO}/actions/runs/${RUN_ID}" \
            > /dev/null

          echo "✅ Deployment 描述已更新"
